<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs>
<style>
@font-face{font-family:GB;src:url(data:font/woff;base64,) format("woff");}
@font-face{font-family:GM;src:url(data:font/woff;base64,) format("woff");}
@font-face{font-family:GR;src:url(data:font/woff;base64,) format("woff");}
.hi{font:26px GM,sans-serif;fill:#C9D6E8}
.name{font:70px GB,sans-serif;fill:#fff}
.tag{font:28px GM,sans-serif;fill:#fff}
.loc{font:20px GR,sans-serif;fill:#B7C7DC}
.code{font:30px GB,sans-serif;fill:#8EC5FF}
.b1{animation:m1 9s ease-in-out infinite alternate}
.b2{animation:m2 11s ease-in-out infinite alternate}
.b3{animation:m3 8s ease-in-out infinite alternate}
.b4{animation:m4 10s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(140px,40px)}}
@keyframes m2{to{transform:translate(-160px,-50px)}}
@keyframes m3{to{transform:translate(-120px,60px)}}
@keyframes m4{to{transform:translate(90px,-70px)}}
.fade{opacity:0;animation:fade .8s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.type{transform-origin:74px 0;transform:scaleX(0);animation:type 2.4s steps(38) .9s forwards}
@keyframes type{to{transform:scaleX(1)}}
.cursor{animation:blink 1s step-end infinite, move 2.4s steps(38) .9s forwards}
@keyframes blink{50%{opacity:0}}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(547px)}}
.line{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
 stroke-dasharray:520;stroke-dashoffset:520;animation:draw 2.2s ease-out .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pt{fill:#0B1830;stroke:#fff;stroke-width:3;opacity:0;animation:pop .3s ease-out forwards}
@keyframes pop{to{opacity:1}}
.tip{fill:#E3EEFA;opacity:0;transform-origin:1160px 108px;animation:pop .3s 2.6s forwards, pulse 1.6s 2.9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5)}}
</style>
